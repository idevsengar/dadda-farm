<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dadda Enviro Varah Farms</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 text-slate-100 min-h-screen font-sans antialiased pb-12">

    <div class="max-w-md mx-auto min-h-screen bg-slate-900/90 shadow-2xl flex flex-col border-x border-slate-700">
        <!-- Modern Header -->
        <header class="p-4 border-b border-slate-700 bg-slate-900/50 backdrop-blur sticky top-0 z-10 flex justify-between items-center">
            <div>
                <h1 class="text-base font-black tracking-tight text-emerald-400">Dadda Enviro Varah Farms</h1>
                <p class="text-[10px] text-slate-400 font-medium">Master Livestock & Operations Dashboard</p>
            </div>
            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                Cloud Sync Active
            </span>
        </header>

        <!-- Navigation Tabs -->
        <nav class="flex border-b border-slate-700 bg-slate-800/40 text-xs font-medium overflow-x-auto">
            <button onclick="switchTab('animals')" id="tab-animals" class="flex-1 py-3 px-2 text-center border-b-2 border-emerald-500 text-emerald-400 transition-all whitespace-nowrap">Animals</button>
            <button onclick="switchTab('breeding'); fetchBreedingLogs();" id="tab-breeding" class="flex-1 py-3 px-2 text-center border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-all whitespace-nowrap">Breeding</button>
            <button onclick="switchTab('feed'); fetchFeedLogs();" id="tab-feed" class="flex-1 py-3 px-2 text-center border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-all whitespace-nowrap">Feed & Cost</button>
        </nav>

        <!-- Main Dynamic Panel -->
        <main class="p-4 flex-1 space-y-4">
            
            <!-- Animals Section -->
            <section id="panel-animals" class="space-y-4">
                <div class="bg-slate-800/60 p-4 rounded-2xl border border-slate-700 shadow-lg space-y-3">
                    <h2 class="text-sm font-bold text-emerald-300">Add Animal Record</h2>
                    
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="tagId" placeholder="Tag ID (e.g. VFH-042)" class="p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-100 focus:border-emerald-500 focus:outline-none">
                        <select id="gender" class="p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-100 focus:border-emerald-500 focus:outline-none">
                            <option value="">Select Gender</option>
                            <option value="Female">Female (Mother)</option>
                            <option value="Male">Male</option>
                            <option value="Piglet">Piglet</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="breed" placeholder="Breed Type" class="p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-100 focus:border-emerald-500 focus:outline-none">
                        <input type="text" id="age" placeholder="Age (e.g. 4 Months)" class="p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-100 focus:border-emerald-500 focus:outline-none">
                    </div>

                    <div class="grid grid-cols-3 gap-2">
                        <input type="number" id="weight" placeholder="Weight (KG)" class="p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-100 focus:border-emerald-500 focus:outline-none">
                        <input type="text" id="mother" placeholder="Mother Tag" class="p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-100 focus:border-emerald-500 focus:outline-none">
                        <input type="text" id="father" placeholder="Father Tag" class="p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-100 focus:border-emerald-500 focus:outline-none">
                    </div>

                    <input type="file" accept="image/*" capture="environment" id="cameraInput" onchange="compressAndStampImage(event)" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-600 file:text-white cursor-pointer">
                    
                    <div id="previewContainer" class="hidden relative inline-block">
                        <img id="previewImg" class="w-24 h-24 object-cover rounded-xl border border-slate-700 shadow" alt="Preview">
                    </div>
                    <input type="hidden" id="base64ImageOutput">

                    <button onclick="saveAnimalToCloud()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white p-3 rounded-xl text-xs font-bold shadow-lg shadow-emerald-900/30 transition-all">Save Animal Record</button>
                </div>

                <div class="space-y-2">
                    <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider">Livestock Overview</h3>
                    <div id="animalListContainer" class="space-y-2 max-h-[35vh] overflow-y-auto pr-1">
                        <p class="text-xs text-slate-500 text-center py-4">Loading records...</p>
                    </div>
                </div>
            </section>

            <!-- Breeding Section -->
            <section id="panel-breeding" class="hidden space-y-4">
                <div class="bg-slate-800/60 p-4 rounded-2xl border border-slate-700 shadow-lg space-y-3">
                    <h2 class="text-sm font-bold text-emerald-300">Log Breeding Record</h2>
                    
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="femaleId" placeholder="Female Tag (Mother)" class="p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-100 focus:border-emerald-500 focus:outline-none">
                        <input type="text" id="maleId" placeholder="Male Tag (Father)" class="p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-100 focus:border-emerald-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-[11px] text-slate-300 mb-1">Breeding / Delivery Date</label>
                        <input type="date" id="breedDate" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-100 focus:border-emerald-500 focus:outline-none">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] text-slate-300 mb-1">Born Count</label>
                            <input type="number" id="bornCount" placeholder="0" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-100 focus:border-emerald-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-300 mb-1">Survived Count</label>
                            <input type="number" id="survivedCount" placeholder="0" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-100 focus:border-emerald-500 focus:outline-none">
                        </div>
                    </div>

                    <button onclick="saveBreedingLog()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white p-3 rounded-xl text-xs font-bold shadow-lg shadow-emerald-900/30 transition-all">Save Breeding Log</button>
                </div>

                <div class="space-y-2">
                    <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider">Breeding History</h3>
                    <div id="breedingListContainer" class="space-y-2 max-h-[40vh] overflow-y-auto pr-1">
                        <p class="text-xs text-slate-500 text-center py-4">Loading breeding records...</p>
                    </div>
                </div>
            </section>

            <!-- Feed & Cost Section -->
            <section id="panel-feed" class="hidden space-y-4">
                <div class="bg-slate-800/60 p-4 rounded-2xl border border-slate-700 shadow-lg space-y-3">
                    <h2 class="text-sm font-bold text-emerald-300">Log Feed Consumption & Cost</h2>
                    
                    <div>
                        <label class="block text-[11px] text-slate-300 mb-1">Feed Type / Category</label>
                        <select id="feedType" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-100 focus:border-emerald-500 focus:outline-none">
                            <option value="Mother Feed">Mother Feed</option>
                            <option value="Child Feed">Child Feed</option>
                            <option value="Male Feed">Male Feed</option>
                            <option value="Hotel Waste">Hotel Waste</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] text-slate-300 mb-1">Quantity (KG)</label>
                            <input type="number" id="feedQty" placeholder="0" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-100 focus:border-emerald-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-300 mb-1">Total Cost (₹)</label>
                            <input type="number" id="feedCost" placeholder="0.00" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-100 focus:border-emerald-500 focus:outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11px] text-slate-300 mb-1">Date</label>
                        <input type="date" id="feedDate" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-100 focus:border-emerald-500 focus:outline-none">
                    </div>

                    <button onclick="saveFeedLog()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white p-3 rounded-xl text-xs font-bold shadow-lg shadow-emerald-900/30 transition-all">Save Feed Log</button>
                </div>

                <div class="space-y-2">
                    <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider">Feed & Cost History</h3>
                    <div id="feedListContainer" class="space-y-2 max-h-[40vh] overflow-y-auto pr-1">
                        <p class="text-xs text-slate-500 text-center py-4">Loading feed records...</p>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script>
        const SUPABASE_URL = "https://zfponxlavgxcofntbbyp.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmcG9ueGxhdmd4Y29mbnRiYnlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMjgwNjcsImV4cCI6MjEwNDkwNDA2N30.IwALgywYSfHCsj0VaCbsc93sM1ps5svYP6GX7Wpvjz8";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function switchTab(tab) {
            ['animals', 'breeding', 'feed'].forEach(t => {
                document.getElementById(`panel-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).className = "flex-1 py-3 px-2 text-center border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-all whitespace-nowrap";
            });
            document.getElementById(`panel-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).className = "flex-1 py-3 px-2 text-center border-b-2 border-emerald-500 text-emerald-400 transition-all whitespace-nowrap";
            
            if(tab === 'animals') fetchAnimals();
            if(tab === 'breeding') fetchBreedingLogs();
            if(tab === 'feed') fetchFeedLogs();
        }

        function compressAndStampImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 500;
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    let dataUrl = canvas.toDataURL('image/jpeg', 0.5);
                    document.getElementById('previewImg').src = dataUrl;
                    document.getElementById('previewContainer').classList.remove('hidden');
                    document.getElementById('base64ImageOutput').value = dataUrl;
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        async function saveAnimalToCloud() {
            const tagId = document.getElementById('tagId').value.trim();
            const gender = document.getElementById('gender').value;
            const breed = document.getElementById('breed').value.trim();
            const age = document.getElementById('age').value.trim();
            const weight = parseFloat(document.getElementById('weight').value) || null;
            const mother = document.getElementById('mother').value.trim();
            const father = document.getElementById('father').value.trim();
            const image = document.getElementById('base64ImageOutput').value;

            if(!tagId || !gender) { alert("Please fill out at least Tag ID and Gender."); return; }

            const { error } = await supabase.from('animals').insert([{ 
                id: 'anim_' + Date.now(), user_id: 'default_user', tagId, gender, breed, age, weight, mother, father, image 
            }]);

            if (error) { alert("Error: " + error.message); } 
            else { 
                alert("Animal saved successfully!"); 
                document.getElementById('tagId').value = ''; 
                document.getElementById('gender').value = ''; 
                document.getElementById('breed').value = ''; 
                document.getElementById('age').value = ''; 
                document.getElementById('weight').value = ''; 
                document.getElementById('mother').value = ''; 
                document.getElementById('father').value = ''; 
                document.getElementById('previewContainer').classList.add('hidden');
                document.getElementById('base64ImageOutput').value = '';
                fetchAnimals();
            }
        }

        async function fetchAnimals() {
            const container = document.getElementById('animalListContainer');
            const { data, error } = await supabase.from('animals').select('*').order('id', { ascending: false });
            if (error || !data || data.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 text-center py-3">No animals found.</p>`;
                return;
            }
            container.innerHTML = data.map(item => `
                <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700 flex items-center gap-3">
                    ${item.image ? `<img src="${item.image}" class="w-14 h-14 object-cover rounded-lg">` : `<div class="w-14 h-14 bg-slate-700 rounded-lg flex items-center justify-center text-[10px] text-slate-400">No Img</div>`}
                    <div class="flex-1">
                        <div class="flex justify-between items-center">
                            <h4 class="text-xs font-bold text-emerald-400">Tag: ${item.tagId} (${item.gender || 'N/A'})</h4>
                            <span class="text-[10px] text-slate-300 bg-slate-900 px-2 py-0.5 rounded">${item.weight ? item.weight + ' KG' : 'No Weight'}</span>
                        </div>
                        <p class="text-[11px] text-slate-300">Breed: ${item.breed || 'N/A'} | Age: ${item.age || 'N/A'}</p>
                        <p class="text-[10px] text-slate-400">Parents - M: ${item.mother || 'None'}, F: ${item.father || 'None'}</p>
                    </div>
                </div>
            `).join('');
        }

        async function saveBreedingLog() {
            const femaleId = document.getElementById('femaleId').value.trim();
            const maleId = document.getElementById('maleId').value.trim();
            const date = document.getElementById('breedDate').value;
            const born = parseInt(document.getElementById('bornCount').value) || 0;
            const survived = parseInt(document.getElementById('survivedCount').value) || 0;

            if(!femaleId || !date) { alert("Please provide Female Tag ID and Date."); return; }

            const { error } = await supabase.from('breeding_logs').insert([{
                id: 'breed_' + Date.now(),
                user_id: 'default_user',
                femaleId,
                maleId,
                date,
                born,
                survived
            }]);

            if(error) { alert("Error saving breeding log: " + error.message); }
            else {
                alert("Breeding log saved successfully!");
                document.getElementById('femaleId').value = '';
                document.getElementById('maleId').value = '';
                document.getElementById('breedDate').value = '';
                document.getElementById('bornCount').value = '';
                document.getElementById('survivedCount').value = '';
                fetchBreedingLogs();
            }
        }

        async function fetchBreedingLogs() {
            const container = document.getElementById('breedingListContainer');
            const { data, error } = await supabase.from('breeding_logs').select('*').order('date', { ascending: false });
            
            if (error || !data || data.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 text-center py-3">No breeding records found.</p>`;
                return;
            }

            container.innerHTML = data.map(item => `
                <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700 space-y-1">
                    <div class="flex justify-between items-center text-xs">
                        <span class="font-bold text-emerald-400">Mother: ${item.femaleId} x Father: ${item.maleId || 'Unknown'}</span>
                        <span class="text-[10px] text-slate-400">${item.date}</span>
                    </div>
                    <div class="flex gap-4 text-[11px] text-slate-300 pt-1">
                        <span>Born: <b>${item.born}</b></span>
                        <span>Survived: <b class="text-emerald-300">${item.survived}</b></span>
                    </div>
                </div>
            `).join('');
        }

        async function saveFeedLog() {
            const type = document.getElementById('feedType').value;
            const qty = parseFloat(document.getElementById('feedQty').value) || 0;
            const cost = parseFloat(document.getElementById('feedCost').value) || 0;
            const date = document.getElementById('feedDate').value;

            if(!date) { alert("Please select a date."); return; }

            const { error } = await supabase.from('feed_logs').insert([{
                id: 'feed_' + Date.now(),
                user_id: 'default_user',
                type,
                qty,
                cost,
                date
            }]);

            if(error) { alert("Error saving feed log: " + error.message); }
            else {
                alert("Feed log saved successfully!");
                document.getElementById('feedQty').value = '';
                document.getElementById('feedCost').value = '';
                fetchFeedLogs();
            }
        }

        async function fetchFeedLogs() {
            const container = document.getElementById('feedListContainer');
            const { data, error } = await supabase.from('feed_logs').select('*').order('date', { ascending: false });
            
            if (error || !data || data.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 text-center py-3">No feed logs recorded yet.</p>`;
                return;
            }

            container.innerHTML = data.map(item => `
                <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700 flex justify-between items-center">
                    <div>
                        <h4 class="text-xs font-bold text-emerald-400">${item.type}</h4>
                        <p class="text-[11px] text-slate-300">Quantity: ${item.qty} KG</p>
                        <p class="text-[10px] text-slate-500">Date: ${item.date}</p>
                    </div>
                    <div class="text-right">
                        <span class="text-xs font-bold text-emerald-300">₹${item.cost}</span>
                    </div>
                </div>
            `).join('');
        }

        // Initialize first load
        fetchAnimals();
    </script>
</body>
</html>
